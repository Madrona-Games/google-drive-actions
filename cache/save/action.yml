name: 'Save a cache'
description: 'Save Cache artifacts like dependencies and build outputs to improve workflow execution time'
author: 'Madrona Games, Inc.'
inputs:
  path:
    description: 'A list of files, directories, and wildcard patterns to cache'
    required: true
  key:
    description: 'An explicit key for saving the cache'
    required: true
  upload-chunk-size:
    description: 'The chunk size used to split up large files during upload, in bytes'
    required: false
  enableCrossOsArchive:
    description:
      'An optional boolean when enabled, allows windows runners to save caches that can be restored on other platforms'
    default: 'false'
    required: false
  google-service-account-credentials-json:
    description: 'The JSON contents of the Google Service Account credentials file'
    required: true
  google-drive-folder-id:
    description: 'The ID of the Google Drive folder to use for caching'
    required: true
runs:
  using: 'node24'
  main: '../../dist/cache/save-only/index.js'
branding:
  icon: 'archive'
  color: 'gray-dark'
